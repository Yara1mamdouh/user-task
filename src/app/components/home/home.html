<div class="container my-5">
  <h2 class="mb-4 text-center">Users List</h2>

  <!-- Search Section -->
  <div class="row mb-4 justify-content-center">
    <div class="col-md-6 d-flex gap-2">
      <input 
        type="text" 
        class="form-control" 
        placeholder="Search by email..." 
        [(ngModel)]="searchEmail" 
      />
      <button class="btn btn-primary" (click)="onSearch()">Search</button>
      <button class="btn btn-secondary" *ngIf="isSearched" (click)="onReset()">Reset</button>
    </div>
  </div>

  <!-- Cards Grid -->
  <div class="row g-4 justify-content-center">
    <div class="col-md-3" *ngFor="let user of filteredUsers">
      <div class="card text-center p-3 h-100 shadow-sm border-2 rounded-4">
        
        <!-- Image -->
        <img [src]="user.image" class="rounded-circle mx-auto mb-2 border" width="70" height="70" alt="Avatar">

        <!-- Role Badge -->
        <div class="mb-3">
          <span class="badge bg-primary px-3 py-2 rounded-pill">{{ user.role }}</span>
        </div>

        <!-- Details -->
        <div class="text-start small text-secondary">
          <p class="mb-1"><strong>Username:</strong> {{ user.username }}</p>
          <p class="mb-1"><strong>Email:</strong> {{ user.email }}</p>
          <p class="mb-1"><strong>Phone:</strong> {{ user.phone }}</p>
          <p class="mb-1"><strong>Birthdate:</strong> {{ user.birthDate }}</p>
        </div>

      </div>
    </div>
  </div>
</div>
